# TicketRush — infrastructure locale (ADR 022)
#
# Lancement en une commande :   docker compose up -d
# Arrêt :                        docker compose down
# Arrêt + effacement des données : docker compose down -v
#
# Contenu actuel : les 4 stockages (PostgreSQL, Redis, Redpanda, Meilisearch),
# Keycloak et le faux prestataire de paiement. Les autres services, Traefik et
# l'observabilité s'ajouteront au jalon 2.
#
# Couper le paiement (démo de panne en soutenance) : docker compose stop faux-paiement
#
# Les valeurs par défaut ci-dessous sont des valeurs de DÉVELOPPEMENT, pour que
# « docker compose up » fonctionne sans configuration. Pour les changer, copier
# .env.example en .env (jamais versionné).
#
# Les ports ne sont ouverts que sur la machine locale (127.0.0.1).

name: ticketrush

services:
  # Source de vérité du Cœur : places, réservations, billets, organisateurs (ADR 004).
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ticketrush}
      POSTGRES_USER: ${POSTGRES_USER:-ticketrush}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ticketrush_dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # À partir de PostgreSQL 18, l'image attend le volume sur /var/lib/postgresql.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g

  # File d'attente, anti-rejeu des jetons, cache, agrégats de l'analytique (ADR 008, 011, 015, 019).
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # Persistance AOF écrite chaque seconde : la file survit à un redémarrage (ADR 008).
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512m

  # Broker d'événements compatible Kafka, avec registre de schémas intégré (ADR 006).
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v25.2.10
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      # Kafka pour les clients lancés sur la machine (hors Docker) : localhost:19092
      - "127.0.0.1:${REDPANDA_KAFKA_PORT:-19092}:19092"
      # Registre de schémas
      - "127.0.0.1:${REDPANDA_SCHEMA_REGISTRY_PORT:-18081}:18081"
      # API d'administration (santé, métriques)
      - "127.0.0.1:${REDPANDA_ADMIN_PORT:-9644}:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1536m

  # Modèle de lecture du catalogue public (ADR 014).
  meilisearch:
    image: getmeili/meilisearch:v1.15
    restart: unless-stopped
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-ticketrush_dev_meili_cle_maitre}
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "127.0.0.1:${MEILI_PORT:-7700}:7700"
    volumes:
      - meilisearch-data:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:7700/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512m

  # Crée la base et l'utilisateur de Keycloak dans PostgreSQL (ADR 004), puis s'arrête.
  # Idempotent : fonctionne aussi sur un volume PostgreSQL déjà initialisé.
  keycloak-db-init:
    image: postgres:18-alpine
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-ticketrush}
      PGUSER: ${POSTGRES_USER:-ticketrush}
      PGPASSWORD: ${POSTGRES_PASSWORD:-ticketrush_dev}
    command:
      - psql
      - -v
      - ON_ERROR_STOP=1
      - -v
      - kc_user=${KEYCLOAK_DB_USER:-keycloak}
      - -v
      - kc_password=${KEYCLOAK_DB_PASSWORD:-keycloak_dev}
      - -v
      - kc_db=${KEYCLOAK_DB:-keycloak}
      - -f
      - /init/init-keycloak.sql
    volumes:
      - ./infra/postgres/init-keycloak.sql:/init/init-keycloak.sql:ro

  # Fournisseur d'identité : OIDC, rôles des acheteurs et des organisateurs (ADR 010).
  # Le domaine « ticketrush » (rôles, clients, utilisateurs de test) est importé au
  # premier démarrage depuis infra/keycloak/realm-ticketrush.json.
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    depends_on:
      keycloak-db-init:
        condition: service_completed_successfully
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_dev}
      # Émetteur fixe des jetons, quel que soit le chemin d'accès (navigateur ou autre
      # conteneur) : les services vérifient tous le même « iss ».
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_dev}
    ports:
      # 8180 côté machine : le port 8080 est souvent déjà pris.
      - "127.0.0.1:${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # L'image n'a pas curl : requête HTTP brute sur le port de gestion (9000).
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1536m

  # Faux prestataire de paiement : accepte ou refuse un paiement simulé (squelette).
  # Indépendant des autres services : on peut l'arrêter seul pour simuler sa panne.
  faux-paiement:
    build:
      context: .
      dockerfile: services/faux-paiement/Dockerfile
    image: ticketrush/faux-paiement:dev
    restart: unless-stopped
    environment:
      PORT: "3000"
      # Jetons de service émis par Keycloak pour le Cœur (ADR 010).
      AUTH_EMETTEUR: http://localhost:${KEYCLOAK_PORT:-8180}/realms/ticketrush
      AUTH_JWKS_URL: http://keycloak:8080/realms/ticketrush/protocol/openid-connect/certs
      AUTH_AUDIENCE: ticketrush-faux-paiement
    ports:
      - "127.0.0.1:${FAUX_PAIEMENT_PORT:-3003}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/sante').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

volumes:
  postgres-data:
  redis-data:
  redpanda-data:
  meilisearch-data:
