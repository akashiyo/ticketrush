# TicketRush — infrastructure locale (ADR 022)
#
# Lancement en une commande :   docker compose up -d
# Arrêt :                        docker compose down
# Arrêt + effacement des données : docker compose down -v
#
# Contenu actuel : les 4 stockages (PostgreSQL, Redis, Redpanda, Meilisearch),
# Keycloak, le Cœur, le faux prestataire de paiement, la file d'attente, l'application
# web (Nginx), Traefik, point d'entrée unique : http://localhost:8000 (ADR 013), et
# l'observabilité, Grafana : http://localhost:3000 (ADR 017). L'Analytique s'ajoutera ensuite.
#
# Couper le paiement (démo de panne en soutenance) : docker compose stop faux-paiement
#
# Les valeurs par défaut ci-dessous sont des valeurs de DÉVELOPPEMENT, pour que
# « docker compose up » fonctionne sans configuration. Pour les changer, copier
# .env.example en .env (jamais versionné).
#
# Les ports ne sont ouverts que sur la machine locale (127.0.0.1).

name: ticketrush

# Variables OpenTelemetry communes aux services (ADR 017), reprises avec « <<: *telemetrie ».
# Chaque service ajoute son OTEL_SERVICE_NAME. Échantillonnage : 1 = toutes les traces ;
# au pic du test de charge, OTEL_TRACES_SAMPLER_ARG=0.1 garde 10 % des traces (ADR 017).
x-telemetrie: &telemetrie
  OTEL_EXPORTER_OTLP_ENDPOINT: http://observabilite:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_METRIC_EXPORT_INTERVAL: "10000"
  OTEL_TRACES_SAMPLER: parentbased_traceidratio
  OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1}

services:
  # Source de vérité du Cœur : places, réservations, billets, organisateurs (ADR 004).
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ticketrush}
      POSTGRES_USER: ${POSTGRES_USER:-ticketrush}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ticketrush_dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # À partir de PostgreSQL 18, l'image attend le volume sur /var/lib/postgresql.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g

  # File d'attente, anti-rejeu des jetons, cache, agrégats de l'analytique (ADR 008, 011, 015, 019).
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # Persistance AOF écrite chaque seconde : la file survit à un redémarrage (ADR 008).
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512m

  # Broker d'événements compatible Kafka, avec registre de schémas intégré (ADR 006).
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v25.2.10
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      # Kafka pour les clients lancés sur la machine (hors Docker) : localhost:19092
      - "127.0.0.1:${REDPANDA_KAFKA_PORT:-19092}:19092"
      # Registre de schémas
      - "127.0.0.1:${REDPANDA_SCHEMA_REGISTRY_PORT:-18081}:18081"
      # API d'administration (santé, métriques)
      - "127.0.0.1:${REDPANDA_ADMIN_PORT:-9644}:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1536m

  # Modèle de lecture du catalogue public (ADR 014).
  meilisearch:
    image: getmeili/meilisearch:v1.15
    restart: unless-stopped
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-ticketrush_dev_meili_cle_maitre}
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "127.0.0.1:${MEILI_PORT:-7700}:7700"
    volumes:
      - meilisearch-data:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:7700/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512m

  # Crée la base et l'utilisateur de Keycloak dans PostgreSQL (ADR 004), puis s'arrête.
  # Idempotent : fonctionne aussi sur un volume PostgreSQL déjà initialisé.
  keycloak-db-init:
    image: postgres:18-alpine
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-ticketrush}
      PGUSER: ${POSTGRES_USER:-ticketrush}
      PGPASSWORD: ${POSTGRES_PASSWORD:-ticketrush_dev}
    command:
      - psql
      - -v
      - ON_ERROR_STOP=1
      - -v
      - kc_user=${KEYCLOAK_DB_USER:-keycloak}
      - -v
      - kc_password=${KEYCLOAK_DB_PASSWORD:-keycloak_dev}
      - -v
      - kc_db=${KEYCLOAK_DB:-keycloak}
      - -f
      - /init/init-keycloak.sql
    volumes:
      - ./infra/postgres/init-keycloak.sql:/init/init-keycloak.sql:ro

  # Fournisseur d'identité : OIDC, rôles des acheteurs et des organisateurs (ADR 010).
  # Le domaine « ticketrush » (rôles, clients, utilisateurs de test) est importé au
  # premier démarrage depuis infra/keycloak/realm-ticketrush.json.
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    depends_on:
      keycloak-db-init:
        condition: service_completed_successfully
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_dev}
      # Keycloak est servi par Traefik sous /auth (ADR 013) : une seule adresse pour le
      # navigateur, http://localhost:8000.
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      # Émetteur fixe des jetons, quel que soit le chemin d'accès (navigateur ou autre
      # conteneur) : les services vérifient tous le même « iss ».
      KC_HOSTNAME: http://localhost:${TRAEFIK_PORT:-8000}/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_dev}
    # Aucun port publié : on passe par Traefik (http://localhost:8000/auth).
    labels:
      traefik.enable: "true"
      traefik.http.services.keycloak.loadbalancer.server.port: "8080"
      traefik.http.routers.keycloak.rule: PathPrefix(`/auth`)
      traefik.http.routers.keycloak.entrypoints: web
      traefik.http.routers.keycloak.service: keycloak
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # L'image n'a pas curl : requête HTTP brute sur le port de gestion (9000), qui
      # reprend le préfixe /auth.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /auth/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1536m

  # Faux prestataire de paiement : accepte ou refuse un paiement simulé (squelette).
  # Indépendant des autres services : on peut l'arrêter seul pour simuler sa panne.
  faux-paiement:
    build:
      context: .
      dockerfile: services/faux-paiement/Dockerfile
    image: ticketrush/faux-paiement:dev
    restart: unless-stopped
    environment:
      <<: *telemetrie
      OTEL_SERVICE_NAME: faux-paiement
      PORT: "3000"
      # Jetons de service émis par Keycloak pour le Cœur (ADR 010).
      AUTH_EMETTEUR: http://localhost:${TRAEFIK_PORT:-8000}/auth/realms/ticketrush
      AUTH_JWKS_URL: http://keycloak:8080/auth/realms/ticketrush/protocol/openid-connect/certs
      AUTH_AUDIENCE: ticketrush-faux-paiement
    ports:
      - "127.0.0.1:${FAUX_PAIEMENT_PORT:-3003}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/sante').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

  # File d'attente virtuelle : entrée, position, admission, jetons d'accès (ADR 008, 009, 011).
  file-attente:
    build:
      context: .
      dockerfile: services/file-attente/Dockerfile
    image: ticketrush/file-attente:dev
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      <<: *telemetrie
      OTEL_SERVICE_NAME: file-attente
      PORT: "3000"
      REDIS_URL: redis://redis:6379
      # Jetons des acheteurs et organisateurs, émis par Keycloak (ADR 010).
      AUTH_EMETTEUR: http://localhost:${TRAEFIK_PORT:-8000}/auth/realms/ticketrush
      AUTH_JWKS_URL: http://keycloak:8080/auth/realms/ticketrush/protocol/openid-connect/certs
      AUTH_AUDIENCE: ticketrush-api
      # Jetons d'admission (ADR 011). Sans clé fournie, une clé est générée au démarrage :
      # suffisant avec une seule instance (voir .env.example).
      JETON_CLE_PRIVEE_PEM: ${FILE_JETON_CLE_PRIVEE_PEM:-}
      JETON_DUREE_SEC: "600"
      ADMISSION_INTERVALLE_MS: "1000"
      # Protection anti-robots ALTCHA (ADR 012). ALTCHA_ACTIF=false uniquement pour le test de charge.
      ALTCHA_ACTIF: ${ALTCHA_ACTIF:-true}
      ALTCHA_SECRET: ${ALTCHA_SECRET:-}
      ALTCHA_DIFFICULTE: ${ALTCHA_DIFFICULTE:-100000}
    ports:
      # Accès direct pour le développement ; les acheteurs passent par Traefik (/api/file).
      - "127.0.0.1:${FILE_ATTENTE_PORT:-3001}:3000"
    labels:
      # Routage et limitation de débit par Traefik (ADR 012 et 013).
      traefik.enable: "true"
      traefik.http.services.file.loadbalancer.server.port: "3000"
      traefik.http.middlewares.file-prefixe.stripprefix.prefixes: /api/file
      # Suivi de la position et clé publique : limite large par adresse IP.
      traefik.http.routers.file.rule: PathPrefix(`/api/file`)
      traefik.http.routers.file.entrypoints: web
      traefik.http.routers.file.service: file
      traefik.http.routers.file.middlewares: file-debit,file-prefixe
      traefik.http.middlewares.file-debit.ratelimit.average: "20"
      traefik.http.middlewares.file-debit.ratelimit.burst: "40"
      # Entrée dans la file et demande de défi : limite stricte par adresse IP.
      traefik.http.routers.file-entree.rule: PathRegexp(`^/api/file/files/[^/]+/(entrer|defi)$$`)
      traefik.http.routers.file-entree.priority: "100"
      traefik.http.routers.file-entree.entrypoints: web
      traefik.http.routers.file-entree.service: file
      traefik.http.routers.file-entree.middlewares: file-debit-entree,file-prefixe
      traefik.http.middlewares.file-debit-entree.ratelimit.average: "2"
      traefik.http.middlewares.file-debit-entree.ratelimit.burst: "5"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/sante').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 384m

  # Cœur (P1) : Catalogue (recherche, fiches) et Réservation (blocage atomique, paiement, billet),
  # Outbox (ADR 001, 003, 005, 007, 014, 015). Les migrations s'appliquent au démarrage ; un
  # catalogue de démonstration est publié et une vente de 5 000 places est chargée (DONNEES_DEMO) :
  # 7e1d5c2a-3b4f-4c6d-8e9f-0a1b2c3d4e50.
  coeur:
    build:
      context: .
      dockerfile: services/coeur/Dockerfile
    image: ticketrush/coeur:dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    environment:
      # Télémétrie (ADR 017) : active dès que le Cœur charge @ticketrush/observabilite.
      <<: *telemetrie
      OTEL_SERVICE_NAME: coeur
      PORT: "3000"
      # Cache des fiches d'événement (ADR 015) et modèle de lecture du catalogue (ADR 014).
      REDIS_URL: redis://redis:6379
      MEILI_URL: http://meilisearch:7700
      MEILI_CLE: ${MEILI_MASTER_KEY:-ticketrush_dev_meili_cle_maitre}
      DATABASE_URL: postgres://${POSTGRES_USER:-ticketrush}:${POSTGRES_PASSWORD:-ticketrush_dev}@postgres:5432/${POSTGRES_DB:-ticketrush}
      # Jetons des acheteurs et organisateurs, émis par Keycloak (ADR 010).
      AUTH_EMETTEUR: http://localhost:${TRAEFIK_PORT:-8000}/auth/realms/ticketrush
      AUTH_JWKS_URL: http://keycloak:8080/auth/realms/ticketrush/protocol/openid-connect/certs
      AUTH_AUDIENCE: ticketrush-api
      # Jetons d'accès signés par la File d'attente (ADR 011), vérifiés localement.
      ADMISSION_JWKS_URL: http://file-attente:3000/.well-known/jwks.json
      ADMISSION_EMETTEUR: ticketrush-file-attente
      # Faux prestataire de paiement, appelé avec un jeton de service Keycloak (ADR 005, 010).
      PAIEMENT_URL: http://faux-paiement:3000
      PAIEMENT_JETON_URL: http://keycloak:8080/auth/realms/ticketrush/protocol/openid-connect/token
      PAIEMENT_CLIENT_ID: ticketrush-coeur
      PAIEMENT_CLIENT_SECRET: ${COEUR_CLIENT_SECRET:-ticketrush-coeur-secret-dev}
      # Relais de l'Outbox vers Redpanda (ADR 006, 007).
      KAFKA_BROKERS: redpanda:9092
      DONNEES_DEMO: ${DONNEES_DEMO:-true}
    ports:
      # Accès direct pour le développement ; les acheteurs passent par Traefik (/api).
      - "127.0.0.1:${COEUR_PORT:-3002}:3000"
    labels:
      # Routage par Traefik (ADR 013) : /api/… → Cœur. /api/file/…, plus long, reste à la File.
      traefik.enable: "true"
      traefik.http.services.coeur.loadbalancer.server.port: "3000"
      traefik.http.middlewares.coeur-prefixe.stripprefix.prefixes: /api
      traefik.http.routers.coeur.rule: PathPrefix(`/api`)
      traefik.http.routers.coeur.entrypoints: web
      traefik.http.routers.coeur.service: coeur
      traefik.http.routers.coeur.middlewares: coeur-debit,coeur-prefixe
      # Limite souple par adresse IP : la file règle déjà le débit des acheteurs (ADR 008, 012).
      traefik.http.middlewares.coeur-debit.ratelimit.average: "20"
      traefik.http.middlewares.coeur-debit.ratelimit.burst: "40"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/sante').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 512m

  # Application web (React), servie par Nginx derrière Traefik : http://localhost:8000 (ADR 013).
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: ticketrush/web:dev
    restart: unless-stopped
    labels:
      traefik.enable: "true"
      traefik.http.services.web.loadbalancer.server.port: "80"
      # Priorité basse : toutes les adresses qui ne sont pas une API arrivent ici.
      traefik.http.routers.web.rule: PathPrefix(`/`)
      traefik.http.routers.web.priority: "1"
      traefik.http.routers.web.entrypoints: web
      traefik.http.routers.web.service: web
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/sante"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 64m

  # Point d'entrée unique : routage, limitation de débit par adresse IP (ADR 012 et 013).
  # Les routes sont déclarées par les étiquettes « traefik.* » de chaque service.
  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --ping=true
      - --log.level=INFO
      # Traces et métriques du point d'entrée en OpenTelemetry (ADR 013, 017) : chaque
      # trace commence à Traefik, qui transmet l'en-tête traceparent aux services.
      - --tracing.otlp=true
      - --tracing.otlp.http.endpoint=http://observabilite:4318/v1/traces
      - --tracing.serviceName=traefik
      - --metrics.otlp=true
      - --metrics.otlp.http.endpoint=http://observabilite:4318/v1/metrics
      - --metrics.otlp.pushInterval=10s
    ports:
      # 8000 côté machine : le port 80 est souvent déjà pris.
      - "127.0.0.1:${TRAEFIK_PORT:-8000}:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256m

  # Observabilité (ADR 017) : OpenTelemetry Collector, Prometheus (métriques), Tempo
  # (traces), Loki (journaux) et Grafana, dans l'image locale tout-en-un grafana/otel-lgtm.
  # Grafana : http://localhost:3000 (accès anonyme, développement uniquement).
  # Les services ne dépendent pas de ce conteneur : s'il s'arrête, la vente continue et
  # la télémétrie est abandonnée (ADR 017).
  observabilite:
    image: grafana/otel-lgtm:0.41.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
      # OTLP pour les services lancés hors Docker (pnpm dev) : gRPC 4317, HTTP 4318.
      - "127.0.0.1:${OTLP_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${OTLP_HTTP_PORT:-4318}:4318"
    volumes:
      # Tableaux de bord versionnés dans le dépôt, chargés au démarrage (ADR 017).
      - ./infra/observabilite/grafana/tableaux-de-bord.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/ticketrush.yaml:ro
      - ./infra/observabilite/grafana/tableaux-de-bord:/otel-lgtm/ticketrush-dashboards:ro
    healthcheck:
      # Prêt quand le Collector reçoit et que Grafana répond.
      test:
        - CMD-SHELL
        - curl -fs http://127.0.0.1:13133/ready >/dev/null && curl -fs http://127.0.0.1:3000/api/health >/dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g

volumes:
  postgres-data:
  redis-data:
  redpanda-data:
  meilisearch-data:
