# Intégration continue de TicketRush (sujet : « Gouvernance : intégration continue »,
# rendu : « CI au vert »). Voir ADR 021.
#
# Version de base (jalon 1) : installation, formatage, lint, types, build, tests.
# Les 3 fonctions de fitness (dépendances, compatibilité des contrats, seuil de
# performance) s'ajouteront au jalon 3.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Une nouvelle poussée sur la même branche annule l'exécution précédente.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verifications:
    name: Installation, lint, types, build, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      # La version de pnpm est lue dans le champ « packageManager » du package.json.
      - name: Installer pnpm
        uses: pnpm/action-setup@v4

      - name: Installer Node.js (version de .node-version)
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Vérifier le formatage
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Vérifier les types
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Tests
        run: pnpm test
