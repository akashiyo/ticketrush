# Intégration continue de TicketRush (sujet : « Gouvernance : intégration continue »,
# rendu : « CI au vert »). Voir ADR 021.
#
# Étapes : installation, formatage, lint, types, fitness, build, tests.
# Fonctions de fitness (sujet : « au moins 3 fonctions de fitness automatisées ») :
#   1. règles de dépendances (dependency-cruiser)       : branchée
#   2. compatibilité des contrats (oasdiff)             : à venir
#   3. seuil de performance (k6, test de charge réduit) : à venir

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Une nouvelle poussée sur la même branche annule l'exécution précédente.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verifications:
    name: Installation, lint, types, build, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      # La version de pnpm est lue dans le champ « packageManager » du package.json.
      - name: Installer pnpm
        uses: pnpm/action-setup@v4

      - name: Installer Node.js (version de .node-version)
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Vérifier le formatage
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Vérifier les types
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # Fitness 1 : frontières hexagonales, modules du Cœur par `api/`, services
      # isolés, aucun cycle (ADR 001, 002, 005, 021). Règles : .dependency-cruiser.cjs
      # Après le build : les paquets partagés (packages/*) sont importés par leur dist/.
      - name: "Fitness : règles de dépendances"
        run: pnpm fitness:dependances

      - name: Tests
        run: pnpm test
