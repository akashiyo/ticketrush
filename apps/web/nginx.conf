# Sert l'application web derrière Traefik (ADR 013), avec la stratégie de cache de l'ADR 015.
server {
  listen 80;
  root /usr/share/nginx/html;

  # Fichiers avec empreinte dans leur nom : mis en cache un an, ils ne changent jamais.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Point de santé pour le contrôle du Compose.
  location = /sante {
    default_type text/plain;
    return 200 "ok";
  }

  # Application à page unique : toute autre adresse renvoie index.html, jamais mis en
  # cache pour qu'un déploiement soit visible immédiatement.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
